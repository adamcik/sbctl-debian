name: Build Debian package and publish APT repo

on:
  workflow_dispatch:
  push:
    branches:
      - trixie
    paths:
      - 'debian/**'
      - '.github/workflows/debian-apt-repo.yml'
      - 'BUILDING.md'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build trixie .deb artifacts
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            build-essential \
            devscripts \
            debhelper \
            dpkg-dev \
            asciidoc-base \
            golang-any \
            libpcsclite-dev \
            pkgconf

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build packages
        run: dpkg-buildpackage -us -uc -b -nc

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp ../*.deb artifacts/
          cp ../*.changes artifacts/
          cp ../*.buildinfo artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages
          path: artifacts/

  publish:
    name: Prepare APT repository artifact for Pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Install repository tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils xz-utils gzip

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: debian-packages
          path: artifacts

      - name: Build repository structure
        run: |
          mkdir -p repo/pool/main repo/dists/trixie/main/binary-amd64
          cp artifacts/*.deb repo/pool/main/

          dpkg-scanpackages --arch amd64 repo/pool > repo/dists/trixie/main/binary-amd64/Packages
          gzip -9c repo/dists/trixie/main/binary-amd64/Packages > repo/dists/trixie/main/binary-amd64/Packages.gz
          xz -9c repo/dists/trixie/main/binary-amd64/Packages > repo/dists/trixie/main/binary-amd64/Packages.xz

          apt-ftparchive release repo/dists/trixie > repo/dists/trixie/Release

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./repo

  deploy:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
