name: Build Debian package and publish APT repo

on:
  workflow_dispatch:
  # Stacked packaging PRs target another task branch before they target trixie.
  pull_request:
  push:
    branches:
      - trixie

permissions:
  contents: read

jobs:
  ownership:
    name: Verify downstream ownership boundary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR or dispatched head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify changed paths and upstream merge provenance
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # GITHUB_TOKEN-created sync PRs dispatch this workflow explicitly.
          # Check their delta against trixie instead of skipping ownership.
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            BASE_SHA="$(git rev-parse origin/trixie)"
          fi
          .github/scripts/check-downstream-ownership.sh \
            "$BASE_SHA" "$HEAD_SHA"

  build:
    name: Build trixie .deb artifacts
    runs-on: ubuntu-latest
    needs: ownership
    permissions:
      contents: read
    container:
      image: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            build-essential \
            devscripts \
            debhelper \
            dpkg-dev \
            asciidoc-base \
            golang-any \
            libpcsclite-dev \
            libssl-dev \
            pkgconf

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build packages
        run: dpkg-buildpackage -us -uc -b -nc

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp ../sbctl_*_all.deb artifacts/
          cp ../sbctl-bin_*_amd64.deb artifacts/
          cp ../*.changes artifacts/
          cp ../*.buildinfo artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages
          path: artifacts/

  verify:
    # PRs (including dispatched upstream-sync builds) use a throwaway key.
    # Never expose the release signing secrets to this unreviewed code.
    name: Verify Debian packages and signed APT repository
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: debian-packages
          path: artifacts

      - name: Install repository tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils xz-utils gzip gnupg

      - name: Build test repository with throwaway key (no release secrets)
        run: |
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'gpgconf --kill all; rm -r "$GNUPGHOME"' EXIT
          gpg --batch --passphrase '' --quick-generate-key 'Package CI <ci@example.invalid>' rsa2048 sign 1d
          APT_GPG_KEY_ID="$(gpg --with-colons --list-secret-keys | awk -F: '$1 == "fpr" {print $10; exit}')"
          APT_GPG_PUBLIC_KEY="$(gpg --armor --export "$APT_GPG_KEY_ID")"
          export APT_GPG_KEY_ID APT_GPG_PUBLIC_KEY
          bash .github/scripts/build-apt-repository.sh artifacts repo

      - name: Install artifacts in clean trixie
        run: |
          docker run --rm -v "$PWD/artifacts:/artifacts:ro" \
            -v "$PWD/.github/scripts/verify-debian-install.sh:/verify.sh:ro" \
            debian:trixie bash /verify.sh deb

      - name: Consume throwaway-key-signed repository in clean trixie
        run: |
          docker run --rm -v "$PWD/artifacts:/artifacts:ro" -v "$PWD/repo:/repo:ro" \
            -v "$PWD/.github/scripts/verify-debian-install.sh:/verify.sh:ro" \
            debian:trixie bash /verify.sh apt

      - name: Reject repository with invalid signature
        run: |
          cp -a repo tampered-repo
          sed -i 's/Origin: Thomas Adamcik/Origin: Tampered/' tampered-repo/dists/trixie/InRelease
          if docker run --rm -v "$PWD/artifacts:/artifacts:ro" -v "$PWD/tampered-repo:/repo:ro" \
            -v "$PWD/.github/scripts/verify-debian-install.sh:/verify.sh:ro" \
            debian:trixie bash /verify.sh apt > signature-check.log 2>&1; then
            echo 'APT accepted a repository with an invalid signature.' >&2
            exit 1
          fi
          cat signature-check.log
          grep -E 'BADSIG|Bad signature|Message has been manipulated' signature-check.log

  publish:
    # Only reviewed trixie pushes use the production key. Test that signed
    # repository before uploading it for the dependent deployment job.
    name: Prepare signed APT repository artifact for Pages
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/trixie'
    environment:
      name: apt-signing
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install repository tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils xz-utils gzip gnupg

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: debian-packages
          path: artifacts

      - name: Import APT signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
        run: |
          set -eu
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --list-secret-keys "$APT_GPG_KEY_ID"

      - name: Build repository structure
        env:
          APT_GPG_KEY_ID: ${{ secrets.APT_GPG_KEY_ID }}
          APT_GPG_PUBLIC_KEY: ${{ secrets.APT_GPG_PUBLIC_KEY }}
        run: |
          set -eu

          bash .github/scripts/build-apt-repository.sh artifacts repo

          printf '%s\n' \
            'Types: deb' \
            'URIs: https://adamcik.github.io/sbctl-debian' \
            'Suites: trixie' \
            'Components: main' \
            'Architectures: amd64' \
            'Signed-By: /etc/apt/keyrings/sbctl-archive-keyring.gpg' \
            > repo/sbctl.sources

          printf '%s\n' \
            'Package: sbctl sbctl-bin' \
            'Pin: origin adamcik.github.io' \
            'Pin-Priority: 700' \
            '' \
            'Package: *' \
            'Pin: origin adamcik.github.io' \
            'Pin-Priority: -1' \
            > repo/sbctl.pref

          cat > repo/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>sbctl Debian APT repository</title>
            <style>
              body { font-family: sans-serif; margin: 2rem auto; max-width: 52rem; line-height: 1.5; padding: 0 1rem; }
              code, pre { background: #f5f5f5; padding: 0.15rem 0.3rem; }
              pre { overflow: auto; padding: 0.75rem; }
            </style>
          </head>
          <body>
            <h1>sbctl Debian APT repository</h1>
            <p>Suite: <code>trixie</code>, Component: <code>main</code>, Architecture: <code>amd64</code>.</p>
            <h2>Install</h2>
            <pre><code>sudo install -d -m 0755 /etc/apt/keyrings

          curl -fsSL https://adamcik.github.io/sbctl-debian/sbctl-archive-keyring.gpg | sudo tee /etc/apt/keyrings/sbctl-archive-keyring.gpg >/dev/null

          cat <<'EOF' | sudo tee /etc/apt/sources.list.d/sbctl.sources >/dev/null
          Types: deb
          URIs: https://adamcik.github.io/sbctl-debian
          Suites: trixie
          Components: main
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/sbctl-archive-keyring.gpg
          EOF

          cat <<'EOF' | sudo tee /etc/apt/preferences.d/sbctl.pref >/dev/null
          Package: sbctl sbctl-bin
          Pin: origin adamcik.github.io
          Pin-Priority: 700

          Package: *
          Pin: origin adamcik.github.io
          Pin-Priority: -1
          EOF

          sudo apt update
          sudo apt install sbctl</code></pre>
          </body>
          </html>
          HTML

      - name: Consume release-signed repository before upload
        run: |
          docker run --rm -v "$PWD/artifacts:/artifacts:ro" -v "$PWD/repo:/repo:ro" \
            -v "$PWD/.github/scripts/verify-debian-install.sh:/verify.sh:ro" \
            debian:trixie bash /verify.sh apt

      - name: Remove signing key material
        if: always()
        run: |
          if [ -n "${GNUPGHOME:-}" ]; then
            gpgconf --kill all
            rm -r "$GNUPGHOME"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./repo

  deploy:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/trixie'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
