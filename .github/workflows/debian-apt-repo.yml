name: Build Debian package and publish APT repo

on:
  workflow_dispatch:
  push:
    branches:
      - trixie
    paths:
      - 'debian/**'
      - '.github/workflows/debian-apt-repo.yml'
      - 'BUILDING.md'

permissions:
  contents: read

jobs:
  build:
    name: Build trixie .deb artifacts
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            build-essential \
            devscripts \
            debhelper \
            dpkg-dev \
            asciidoc-base \
            golang-any \
            libpcsclite-dev \
            pkgconf

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build packages
        run: dpkg-buildpackage -us -uc -b -nc

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp ../*.deb artifacts/
          cp ../*.changes artifacts/
          cp ../*.buildinfo artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages
          path: artifacts/

  publish:
    name: Publish APT repository to gh-pages
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: debian-packages
          path: artifacts

      - name: Build repository structure
        run: |
          mkdir -p repo/pool/main repo/dists/trixie/main/binary-amd64
          cp artifacts/*.deb repo/pool/main/

          dpkg-scanpackages --arch amd64 repo/pool > repo/dists/trixie/main/binary-amd64/Packages
          gzip -9c repo/dists/trixie/main/binary-amd64/Packages > repo/dists/trixie/main/binary-amd64/Packages.gz
          xz -9c repo/dists/trixie/main/binary-amd64/Packages > repo/dists/trixie/main/binary-amd64/Packages.xz

          apt-ftparchive release repo/dists/trixie > repo/dists/trixie/Release

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./repo
          force_orphan: true
