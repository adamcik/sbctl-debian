name: CI
on: [push, pull_request]
jobs:
   actions-lock:
      name: Actions dependency lockfile
      runs-on: ubuntu-latest
      permissions:
         contents: read
      steps:
         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
           with:
              persist-credentials: false
         - name: Verify Actions dependency lockfile
           uses: adamcik/nix-tooling/actions/verify-actions-lock@a73c6c63e01f95b7f7e88e95fc5a20a8339c66d4
   arch:
      runs-on: ubuntu-latest
      container:
         image: archlinux:latest
         options: --device /dev/kvm
      steps:
         - run: pacman --noconfirm --noprogressbar -Syu
         - run: pacman --noconfirm --noprogressbar -S make go asciidoc gcc git edk2-ovmf qemu-system-x86 pkgconf pcsclite
         - uses: actions/checkout@v1
         - run: git config --global --add safe.directory $(pwd)
         - run: make
         - run: make test
         - run: make integration
         - run: GOBIN=/usr/bin make lint
   void:
      runs-on: ubuntu-latest
      container: ghcr.io/void-linux/void-musl
      steps:
         # update xbps, if necessary
         - run: xbps-install -Syu || ( xbps-install -yu xbps && xbps-install -Syu)
         - run: xbps-install -y make go asciidoc gcc git openssl-devel pkg-config pcsclite-devel
         - uses: actions/checkout@v1
         - run: git config --global --add safe.directory $(pwd)
         - run: make
         - run: make test
         - run: GOBIN=/usr/bin make lint
